version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: wd_db
    restart: always
    environment:
      POSTGRES_DB: "${DATABASE_NAME}"
      PGUSER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
      
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${DATABASE_OUTER_PORT}:${DATABASE_INNER_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-U", "${DATABASE_USER}", "-d", "${DATABASE_NAME}", ]
      interval: 10s
      timeout: 5s
      retries: 5
  
  test-db:
    image: postgres:latest
    container_name: test_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    volumes:
      - test_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres", "-d", "test_db",]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: wd_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ngrok:
        condition: service_started
    environment:
      - WEB_APP_URL=${WEB_APP_URL}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: ["python", "main.py"]
  
  test:
    build:
      dockerfile: test/Dockerfile
      context: .
    depends_on:
      test-db:
        condition: service_healthy
    container_name: test_app
    volumes:
      - .:/test
    
  web_app:
    build:
      dockerfile: web_app/Dockerfile
      context: .
    volumes:
      - .:/web_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=web_app.app.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_HOST=${DJANGO_HOST}
      - DJANGO_PORT=${DJANGO_PORT}
    ports:
      - "80:${DJANGO_PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${DJANGO_PORT}/health/')"]
      interval: 2m
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["uvicorn", "web_app.app.asgi:application", "--host", "${DJANGO_HOST}", "--port", "${DJANGO_PORT}"]
  
  redis:
    image: redis:latest
    container_name: wd_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec --bind 0.0.0.0
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_OUTER_PORT}:${REDIS_INNER_PORT}"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "web_app:8080"
      - "--url=${NGROK_DOMAIN}"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      web_app:
        condition: service_healthy
    
volumes:
  postgres_data:
    driver: local
  test_postgres_data:
    driver: local
  redis_data:
    driver: local