game_interrupted_message:
  template: Игра была прервана администратором. О подробностях узнавайте у организаторов.
  markdown: false
waiting_time_expired:
  template: Время ожидания ответа превышено. Перевод отменён.
  markdown: false
already_started:
  template: Вы не можете начать игру, т.к. игра уже в процессе.
