  markdown: false
unknight:
  template: 👎 Верховный лидер лишил вас статуса администратора.
  markdown: false
refuse_request_notification:
  template: Вы отказали пользователю {{user.first_name}}.
  markdown: false
fire_admin_notification_for_user:
  template: Верховный лидер посчитал вас недостойным статуса администратора.
