action_out_of_game:
  template: Вы не можете выполнить данное действие, т.к. находитесь вне игры.
  markdown: false
unexpected_error:
  template: Произошла непредвиденная ошибка.
  markdown: false
choose_pack:
  template: Выберите набор планет и городов для игры.
  markdown: false
not_enogh_money_for_transaction:
  template: Недостаточно средств для перевода. Укажите сумму меньше.
  markdown: false
