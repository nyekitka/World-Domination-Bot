help: 
  template: |
    # 🌍 Правила игры

    У каждой планеты есть 4 города. Ваша цель — к концу игры иметь **максимально высокий средний уровень жизни своих городов**.

    Игра состоит из {{ game_config.ROUND_NUM }} {{ 'раунд' | make_agree_with(game_config.ROUND_NUM, 'ru') }} по {{ game_config.timedelta_round_length | time_filter('ru') }}.

    После каждого раунда проходят общие межпланетные переговоры, на которых обсуждаются результаты раунда. Переговоры не ограничены по времени.

    После последнего раунда побеждает планета с наибольшим **средним уровнем жизни четырёх городов**.

    Если активность аномалии достигает 100%, **проигрывают все**. Если у планеты разрушены все города, её уровень жизни равен 0, поэтому она уже не может победить, но продолжает участвовать в игре.

    <details>
    <summary>🌆 Города и развитие</summary>

    Изначально каждый город имеет **{{ game_config.DEFAULT_DEVELOPMENT }}% развития**.

    📈 *Развитие города* увеличивает его развитие на **{{ game_config.DEVELOPMENT_BOOST }}%**. Максимального уровня развития нет.

    Уровень жизни города зависит от:

    - его развития
    - общей для всех планет активности аномалии

    Чем выше развитие города и чем ниже активность аномалии, тем выше его уровень жизни.

    Если город разрушен, его развитие и уровень жизни становятся **0 навсегда**. Восстановить разрушенный город нельзя.

    Уровень жизни планеты — это средний уровень жизни её четырёх городов. Разрушенные города также учитываются как 0.
    </details>

    <details>
    <summary>💰 Экономика</summary>

    В начале каждого раунда планета получает доход от своих городов. Доход зависит от их развития и активности аномалии.

    Разрушенные города дохода не приносят.

    Доход планеты также уменьшается из-за санкций, наложенных на неё в **предыдущем раунде**.

    В начале игры у каждой планеты **{{ game_config.DEFAULT_BALANCE }} 💵**.

    Деньги можно тратить на:

    - развитие городов
    - щиты
    - разработку технологии метеоритов
    - покупку метеоритов
    - переводы другим планетам

    Нельзя потратить больше денег, чем у вас есть. При выборе платного действия его стоимость сразу резервируется из вашего баланса.
    </details>

    <details>
    <summary>☄️ Аномалия</summary>

    Активность аномалии — **общий показатель для всех планет**. В начале игры она составляет **{{ 100 - game_config.DEFAULT_GAME_ECO_RATE }}%**.

    Чем выше её активность, тем ниже уровень жизни и доход всех городов.

    Активность аномалии увеличивается при:

    - разработке технологии метеоритов
    - покупке метеоритов
    - отправке метеоритов в города

    Уменьшить активность можно, отправив метеорит в аномалию. Один метеорит уменьшает её активность на {{ game_config.ECO_BOOST_RATE }}%.

    Активность не может превысить 100%.

    При достижении **100%** уровень жизни всех городов становится 0, и **все планеты проигрывают**.
    </details>

    <details>
    <summary>📜 Приказы</summary>

    В течение раунда вы формируете **приказ** — набор действий, которые хотите выполнить.

    Действия из приказа не выполняются сразу. **Все приказы выполняются в конце раунда.**

    Развитие городов и установка щитов происходят **до атак метеоритами**. Поэтому щит, установленный в текущем раунде, уже может защитить город от метеорита этого же раунда.

    После выполнения приказов игроки видят результаты раунда и переходят к межпланетным переговорам.
    </details>

    <details>
    <summary>📈 Действия в приказе: развитие, щиты, технология</summary>

    ### 📈 Развитие города

    Вложите {{ game_config.DEVELOPMENT_COST }} 💵 в один из своих городов и увеличьте его развитие на {{ game_config.DEVELOPMENT_BOOST }}%.
    Разрушенный город развивать нельзя.
    На один город можно заказать не более одного развития за раунд.

    ### 🛡️ Защита города

    Поставьте щит над своим городом.
    Один щит защищает город от **одного метеорита**. После попадания метеорита щит уничтожается, а город остаётся цел.
    Если в город прилетят два или более метеоритов за один раунд, город будет разрушен независимо от наличия щита.
    На один город можно поставить не более одного щита одновременно. Можно заказать новый щит на уже защищённый город: если старый щит будет уничтожен в этом раунде, новый останется; если старый не будет уничтожен, деньги за новый щит будут потрачены впустую.
    Действие доступно со 2-го раунда.
    *Стоимость: {{ game_config.SHIELD_COST }} 💵*

    ### 🛠️ Разработка технологии метеоритов

    Разработайте технологию отправки метеоритов.
    Это единоразовое действие за игру. После разработки технологии можно покупать метеориты.
    Технология становится доступна **со следующего раунда**, поэтому в том же раунде купить метеориты или использовать их нельзя.
    *Стоимость: {{ game_config.INVENTION_COST }} 💵*
    </details>

    <details>
    <summary>☄️ Метеориты и санкции</summary>

    ### ☄️ Покупка метеоритов

    После разработки технологии можно покупать метеориты.
    За один раунд можно купить не более **{{ game_config.MAX_METEORITES_TO_BUY }} {{ 'метеорит' | make_agree_with(game_config.MAX_METEORITES_TO_BUY) }}**:

    {% for i in range(1, game_config.MAX_METEORITES_TO_BUY + 1) -%}
    - {{ i }} {{ 'метеорит' | make_agree_with(i) }} — {{ i * game_config.CREATE_COST }} 💵
    {% endfor %}
    Купленные метеориты становятся доступны **со следующего раунда**. Хранить неиспользованные метеориты можно сколько угодно.
    Покупка каждого метеорита увеличивает активность аномалии.

    ### ☄️ Отправка метеорита в город

    Отправьте метеорит в город другой планеты.

    - Метеорит разрушает город, если на нём нет щита
    - Если на городе есть щит, метеорит уничтожает щит, но не город
    - Если в город прилетели два или более метеоритов, город разрушается
    - Одна планета может отправить в один город только **один метеорит за раунд**
    - Отправитель метеорита неизвестен атакуемой планете

    Поэтому для гарантированного уничтожения города можно скоординировать атаку нескольких планет.

    Отправка метеорита увеличивает активность аномалии.

    ### 💥 Отправка метеорита в аномалию

    Отправьте один метеорит в общую аномалию и уменьшите её активность на {{ game_config.ECO_BOOST_RATE }}%.
    За один раунд можно отправить в аномалию **не более одного метеорита**.

    ### 🧾 Санкции

    Отправьте пакет санкций другой планете и уменьшите её доход в **следующем раунде**.

    - Отправка санкций бесплатна
    - Одной планете нельзя отправить более одного пакета санкций за раунд
    - Одновременно можно отправлять санкции нескольким разным планетам

    Планета знает, кто отправил ей санкции.
    </details>

    <details>
    <summary>📞 Действия вне приказа</summary>

    Эти действия выполняются **сразу**, не дожидаясь конца раунда.

    ### 📞 Переговоры

    Отправьте другой планете запрос на переговоры.
    Если его примут, один ваш дипломат отправится на территорию другой планеты. Принимающая планета также может отказать или некоторое время не отвечать на предложение.
    На своей территории планета может одновременно принимать не более **одного дипломата**, но может отправлять своих дипломатов сразу в несколько других планет.
    Переговоры не дают никаких игровых преимуществ — это способ общаться, договариваться, координировать атаки, заключать союзы и обмениваться информацией.
    Переговоры автоматически заканчиваются с окончанием раунда.

    ### 💸 Перевод денег

    Переведите другой планете любую доступную сумму денег.
    Перевод происходит **мгновенно и безвозвратно**.
    </details>

    <details>
    <summary>⚠️ Важные правила</summary>

    - Все действия из приказа выполняются в конце раунда
    - Платные действия резервируют деньги сразу при добавлении в приказ
    - Купленные метеориты и разработанная технология становятся доступны только со следующего раунда
    - Один город может получить только один метеорит от каждой планеты за раунд
    - Один щит защищает только от одного метеорита
    - Разрушенные города восстановить нельзя
    - Планета с разрушенными городами продолжает участвовать в игре, даже если все 4 города уничтожены
    - Активность аномалии общая для всех планет
    - При 100% активности аномалии проигрывают все
    - При равном среднем уровне жизни победителя нет — фиксируется ничья
    - Победитель определяется после последнего раунда
    </details>
  markdown: true
