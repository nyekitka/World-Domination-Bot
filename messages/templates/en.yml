    *Available budget:* _{{planet.balance}}_ 💵
    *Avg\. life rate on the planet:* _{{planet.development}}%_

    {% for city in cities -%}
    {% if city.development == 0 -%}
    *{{ city.name | escape_md }}* ❌:
    {%- elif city.is_shielded -%}
    *{{ city.name | escape_md }}* 🛡️:
    {%- else -%}
    *{{ city.name | escape_md }}*:
    {%- endif %}
    Development {{ city.development }}%, Life rate {{ city.rate_of_life }}%, Income {{ city.income }} 💵

    {% endfor %}
  markdown: true
sanctions_info:
